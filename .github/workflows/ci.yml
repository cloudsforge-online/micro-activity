name: CI

# The whole file. Every service in the estate calls the ONE reusable workflow in micro-org rather
# than carrying its own copy — the measured target in docs/ecosystem/03 §5 is zero bespoke CI files.
# If this repository ever needs a job of its own, that is the signal the reusable workflow needs an
# input, not that this repository needs a fork of it.
#
# `service-ci.yml` typechecks, runs the suite against a real Postgres, and FAILS the build if the
# database-backed suite skipped — which is why `src/testsupport.ts` reads ACTIVITY_TEST_DATABASE_URL
# and `src/notify/testsupport.ts` reads NOTIFY_TEST_DATABASE_URL, spelled exactly as the workflow
# exports them. It also enforces the estate rules (one database, no cross-service imports, the three
# health endpoints, no unleased timers) that repository walls used to enforce for free.
#
# ══════════════════════════════════════════════════════════════════════════════════════════════════
# WAVE M2: THIS REPOSITORY OWNS TWO DATABASES, AND SAYING SO IS NOT COSMETIC.
#
# `database-env-var` is a LIST since micro-org#519. Every name in it gets its own CI database, its
# own exported pair, and — the part that matters — is treated as OWN by the skip scan.
#
# Declaring only `ACTIVITY_DATABASE_URL` here would not have been red. It would have been GREEN with
# five notify-side suites silently gone: `the merged surface`, `a saturated notify runner does not
# starve the activity queue`, notify's `pipeline`, `applied schema` and `reservedDomainDeliveries`.
# Measured on this branch — with only the activity DSN exported the suite reports **370 pass / 0
# fail** instead of 443, and every one of those five prints `set NOTIFY_TEST_DATABASE_URL`. The OLD
# skip scan read a foreign variable name as "a cross-service tier stood down" and emitted a notice;
# with `NOTIFY_DATABASE_URL` declared here, the same lines are the disaster the block exists for and
# the build fails.
#
# Note what the runner's own summary says in that state: `skipped 0`. node:test does not count the
# cases inside a skipped `describe`, so "nothing was skipped" is not evidence that nothing was.
#
# The two databases must also be SEPARATE, which the shared workflow does per declared name. Both
# modules own a table called `inbox` — with IDENTICAL COLUMNS — and a table called `jobs`
# (`migratortargets.test.ts` measures both), so one shared database would have one suite truncating
# the other's rows mid-test, and would put two migration ledgers in one `schema_migrations`.
#
# `ACTIVITY_DATABASE_URL_TESTNET` is deliberately NOT declared. The workflow's suffix check requires
# every entry to end in `_DATABASE_URL`, so a `_TESTNET` name fails the `rules` job outright — and
# it is invisible to Rule 1's pattern anyway, because the trailing word boundary cannot match before
# the following underscore.
# ══════════════════════════════════════════════════════════════════════════════════════════════════

on:
  push:
    # `release/**` builds too. A release branch carries the estate-wide version bump, and it
    # has to publish its images before testnet can be deployed from it — which is what proves
    # the release before anything is merged. Mainnet is unaffected: it pins a version tag.
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: activity
      # Both, whitespace-separated. See the block at the top of this file for what declaring only
      # the first would have cost, measured rather than guessed.
      database-env-var: ACTIVITY_DATABASE_URL NOTIFY_DATABASE_URL
      # ONE port, because there is one listener. micro-notify's caller declared 4600 and its
      # compose block bound container port 4000 anyway — the 4600 was only ever the CI smoke
      # binding and `NOTIFY_PUBLIC_URL` below followed it. In the merged image the socket is
      # activity's, so both move to 4000.
      port: 4000
      # The image startup smoke test boots the real service, and `env.ts` validates its
      # configuration at import — so the container needs the variables it declares, not just a
      # database, or it exits before it serves /livez. The identity URLs are CI-only NON-secrets,
      # never dialled because /livez needs no upstream, and never a real credential.
      #
      # ACTIVITY_INGEST_SECRETS IS NOT IN THAT CATEGORY ANY MORE, and the value it used to carry is
      # why. `ci-only-not-a-real-secret-…` "only had to clear a length check" — which is word for
      # word the property that let `estate-only-outbox-secret-…` sit on 54 lines of a PUBLIC compose
      # file and pass every guard in the estate (micro-org #142). It is the same shared key under a
      # sixth name, and it is what stands between an unauthenticated POST and the canonical record
      # of what happened to a user's money. The boot guard now checks the SHAPE and has no CI
      # exemption, so `@generate` asks service-ci.yml for a fresh `openssl rand -base64 48` per run:
      # CI holds a real secret rather than a string claiming to be one.
      #
      # THE NOTIFY HALF'S TWO VARIABLES ARE HERE FOR THE SAME REASON. Since wave M2 this image
      # boots `src/notify/module.ts`, which imports its own `env.ts` — so the merged container exits
      # before it binds a socket unless the notify configuration is present too.
      # `NOTIFY_INGEST_SIGNING_SECRET` is `@generate` for exactly the reason above; it is the key
      # that authenticates an event which mints a "your key was exported" email, and it is refused
      # by @cloudsforge/secrets if it looks like a placeholder. `NOTIFY_PUBLIC_URL` names the merged
      # port, not notify's old 4600 — there is one listener now, and a smoke test that probes a port
      # nothing binds is a smoke test that fails for the wrong reason.
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        ACTIVITY_INGEST_SECRETS=@generate
        NOTIFY_INGEST_SIGNING_SECRET=@generate
        NOTIFY_PUBLIC_URL=http://127.0.0.1:4000
    secrets:
      # @cloudsforge/* is resolved by link:../runtime and link:../contracts, so CI checks out
      # micro-runtime and micro-contracts as siblings — both private, so the workflow needs a
      # contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts, image name derived
  # at tools/registry.ts); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts); and deploy/scripts/release-deploy.sh refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [ci, hygiene]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/'))
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
